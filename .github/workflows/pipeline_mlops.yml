# Workflow ÚNICO do projeto: cada execução é um ciclo completo do pipeline MLOps.
#
# Gatilhos:
# - schedule: agendamento nativo do GitHub (cron).
# - workflow_dispatch com origem=encadeado: agendamento automático de contingência. O serviço
#   de agendamento do GitHub não criou nenhuma execução nesta conta (nem num repositório de
#   teste mínimo com cron a cada 5 min); por isso, ao fim de cada ciclo bem-sucedido, o job
#   'agendar-proximo' espera o intervalo e dispara o ciclo seguinte, até zerar o contador.
name: pipeline-mlops

on:
  schedule:
    # Minutos "quebrados" porque a fila do GitHub fica mais cheia na virada da hora.
    # Desligar o workflow após coletar as evidências.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      origem:
        description: "manual (depuração), inicio (abre uma sequência automática) ou encadeado (disparado pelo próprio pipeline)"
        type: choice
        options: [manual, inicio, encadeado]
        default: manual
      ciclos_restantes:
        description: "Quantos ciclos ainda disparar automaticamente depois deste (0 = nenhum)"
        default: "0"
      intervalo_minutos:
        description: "Espera entre o fim de um ciclo e o disparo do próximo"
        default: "5"

permissions:
  contents: write   # devolver state/, models/ e evidencias/ ao repositório
  issues: write     # abrir issue quando houver alerta de drift
  actions: write    # disparar o próximo ciclo da sequência automática

# Ciclos nunca rodam em paralelo: cada um depende do estado deixado pelo anterior.
concurrency:
  group: pipeline-mlops
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout (inclui estado persistido dos ciclos anteriores)
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes das regras do pipeline
        run: python -m pytest -q

      - name: Identificar ciclo
        run: |
          CYCLE_ID="c$(date -u +%Y%m%dT%H%M%SZ)-gh${GITHUB_RUN_ID}"
          echo "CYCLE_ID=${CYCLE_ID}" >> "$GITHUB_ENV"
          echo "PASTA_CICLO=evidencias/ciclos/${CYCLE_ID}" >> "$GITHUB_ENV"
          echo "Ciclo ${CYCLE_ID} disparado por: ${{ github.event_name }} (origem: ${{ inputs.origem || github.event_name }})"
          echo "Modelo vigente antes do ciclo:"
          cat models/modelo_vigente.json 2>/dev/null || echo "(nenhum)"

      - name: 01 - ETL, validação e drift
        run: jupyter nbconvert --to notebook --execute notebooks/01_etl.ipynb --output-dir "$PASTA_CICLO/notebooks" --output 01_etl_executado --ExecutePreprocessor.timeout=1800

      - name: 02 - Três métodos e votação de features
        run: jupyter nbconvert --to notebook --execute notebooks/02_votacao_features.ipynb --output-dir "$PASTA_CICLO/notebooks" --output 02_votacao_features_executado --ExecutePreprocessor.timeout=1800

      - name: 03 - Treino dos modelos A e B
        run: jupyter nbconvert --to notebook --execute notebooks/03_treino_competicao.ipynb --output-dir "$PASTA_CICLO/notebooks" --output 03_treino_competicao_executado --ExecutePreprocessor.timeout=1800

      - name: 04 - Eleição e promoção
        run: jupyter nbconvert --to notebook --execute notebooks/04_selecao_promocao.ipynb --output-dir "$PASTA_CICLO/notebooks" --output 04_selecao_promocao_executado --ExecutePreprocessor.timeout=1800

      - name: 05 - Previsões com o vigente e teste integrado
        run: jupyter nbconvert --to notebook --execute notebooks/05_previsoes.ipynb --output-dir "$PASTA_CICLO/notebooks" --output 05_previsoes_executado --ExecutePreprocessor.timeout=1800

      - name: Registrar evidência da execução
        if: always()
        run: |
          mkdir -p "$PASTA_CICLO"
          cat > "$PASTA_CICLO/execucao.json" <<EOF
          {
            "cycle_id": "${CYCLE_ID}",
            "gatilho": "${{ github.event_name }}",
            "origem": "${{ inputs.origem || github.event_name }}",
            "ciclos_restantes_na_sequencia": "${{ inputs.ciclos_restantes || '' }}",
            "ator": "${{ github.actor }}",
            "cron": "${{ github.event.schedule }}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "status_job": "${{ job.status }}"
          }
          EOF
          cat "$PASTA_CICLO/execucao.json"

      - name: Resumo do ciclo
        if: always()
        run: |
          echo "**Gatilho:** \`${{ github.event_name }}\` · **origem:** \`${{ inputs.origem || github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          for arquivo in resumo.md drift.md; do
            if [ -f "$PASTA_CICLO/$arquivo" ]; then cat "$PASTA_CICLO/$arquivo" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Abrir issue se houver alerta de drift (critério 10)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALERTA=$(python -c "import json; print(json.load(open('$PASTA_CICLO/drift.json')).get('alerta', False))")
          if [ "$ALERTA" = "True" ]; then
            gh issue create --title "Alerta de drift - ciclo ${CYCLE_ID}" --body-file "$PASTA_CICLO/drift.md"
          else
            echo "Sem alerta de drift neste ciclo."
          fi

      - name: Persistir estado no repositório
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state models evidencias
          git commit -m "ciclo ${CYCLE_ID} (${{ inputs.origem || github.event_name }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Só o que é deste ciclo: o histórico completo (MLflow, modelos) já volta ao repositório
      # pelo commit acima, e state/ inteiro cresceria a cada ciclo, consumindo a cota de
      # armazenamento de artifacts (500 MB em repositório privado no plano Free).
      - name: Publicar pacote do ciclo (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-${{ env.CYCLE_ID }}
          path: |
            ${{ env.PASTA_CICLO }}
            models/modelo_vigente.json
            state/historico_ciclos.csv
          if-no-files-found: warn
          retention-days: 30

  # Agendamento automático de contingência (ver comentário no topo). Só roda se o ciclo deu
  # certo, então uma falha interrompe a sequência e nenhum ciclo seguinte é disparado.
  agendar-proximo:
    needs: ciclo
    if: success() && github.event_name == 'workflow_dispatch' && inputs.ciclos_restantes != '0' && inputs.ciclos_restantes != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Aguardar o intervalo e disparar o próximo ciclo
        env:
          GH_TOKEN: ${{ github.token }}
          RESTANTES: ${{ inputs.ciclos_restantes }}
          INTERVALO: ${{ inputs.intervalo_minutos }}
        run: |
          PROXIMO=$(( RESTANTES - 1 ))
          echo "Aguardando ${INTERVALO} min antes do próximo ciclo (restarão ${PROXIMO} depois dele)."
          sleep $(( INTERVALO * 60 ))
          gh workflow run pipeline_mlops.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f origem=encadeado -f ciclos_restantes="$PROXIMO" -f intervalo_minutos="$INTERVALO"
          echo "**Próximo ciclo disparado automaticamente** (restam ${PROXIMO} na sequência)." >> "$GITHUB_STEP_SUMMARY"
